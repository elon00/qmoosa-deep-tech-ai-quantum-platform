name: Safe npm dependency remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproduce locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply non-breaking security updates
        run: npm audit fix --audit-level=high
      - name: Reinstall from regenerated lockfile
        run: npm ci
      - name: Strict critical and high production security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Record complete production audit (including moderate issues)
        shell: bash
        run: |
          npm audit --omit=dev --json > production-audit.json || audit_exit=$?
          node --input-type=module -e "
            import fs from 'node:fs';
            const a=JSON.parse(fs.readFileSync('production-audit.json','utf8'));
            console.log(JSON.stringify({vulnerabilities:a.metadata?.vulnerabilities ?? {}, affectedPackages:Object.keys(a.vulnerabilities ?? {})},null,2));
          "
          echo "Full audit exit status: ${audit_exit:-0}"
      - name: Validate types and production build
        run: |
          npm run lint
          npm run build
      - name: Open reviewable dependency-fix PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: automation/nonbreaking-npm-security-fix
          delete-branch: true
          commit-message: "fix(security): non-breaking npm dependency remediation"
          title: "fix(security): update audited npm dependencies without forced Solana migration"
          body: |
            Automated security updates using npm audit fix without --force.
            Reproducible install, production critical/high audit, lint and build passed in the remediation workflow.
            **Moderate advisories are not treated as fully remediated**: review full audit output.
            Run the repository's required tests and CI on this PR before merging.
            Do not claim mainnet readiness from this dependency audit.

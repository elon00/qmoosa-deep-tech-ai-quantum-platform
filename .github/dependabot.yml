version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/program"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "curve25519-dalek"
        # Transitive dependency pinned by solana-program 1.18.x.
        # Upgrade requires moving the Solana/Anchor dependency stack.
